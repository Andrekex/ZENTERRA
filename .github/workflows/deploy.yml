name: Deploy theme to Hostiq

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-hostiq-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          php -v | head -1
          find theme -name '*.php' -print0 | xargs -0 -n1 php -l

  deploy:
    needs: lint
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.HOSTIQ_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTIQ_HOST }}
          SSH_PORT: ${{ secrets.HOSTIQ_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull latest main on the server and install the theme
        env:
          SSH_HOST: ${{ secrets.HOSTIQ_HOST }}
          SSH_PORT: ${{ secrets.HOSTIQ_PORT || '22' }}
          SSH_USER: ${{ secrets.HOSTIQ_USER }}
          REPO_DIR: ${{ secrets.HOSTIQ_REPO_DIR || '~/repositories/ZENTERRA' }}
          WP_ROOT: ${{ secrets.HOSTIQ_WP_ROOT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "set -e; cd $REPO_DIR && git fetch --quiet origin main && git reset --hard --quiet origin/main && bash deploy.sh $WP_ROOT"
